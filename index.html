<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER TELEPATHY 2000 // 雲端心電感應</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            y2k: {
              black: '#07070c',
              card: '#0f0f1a',
              pink: '#ff007f',
              cyan: '#00f3ff',
              green: '#a3ff00',
              yellow: '#ffe600',
              purple: '#7000ff',
              darkcard: 'rgba(15, 15, 26, 0.85)'
            }
          },
          fontFamily: {
            mono: ['Courier New', 'Consolas', 'monospace'],
            cyber: ['Impact', 'Arial Black', 'sans-serif']
          },
          boxShadow: {
            'neon-pink': '0 0 20px rgba(255, 0, 127, 0.5)',
            'neon-cyan': '0 0 20px rgba(0, 243, 255, 0.5)',
            'neon-green': '0 0 20px rgba(163, 255, 0, 0.5)',
            'cyber-inset': 'inset 0 0 15px rgba(0, 243, 255, 0.2)'
          }
        }
      }
    }
  </script>

  <!-- Google Fonts for Retro Vibe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Zen+Dot&display=swap" rel="stylesheet">

  <style>
    /* Y2K & Custom Animation Styling */
    body {
      background-color: #07070c;
      color: #e2e8f0;
      font-family: 'Zen Dot', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .font-vt323 {
      font-family: 'VT323', monospace;
    }

    /* Animated Grid Background */
    .bg-cyber-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.07) 1px, transparent 1px);
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Scanline effect overlay */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.3) 50%,
        rgba(0, 0, 0, 0.3)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* 3D Flip Card Styles */
    .perspective-1000 {
      perspective: 1000px;
    }
    
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1rem;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    /* Neon Text Glow */
    .glow-text-pink {
      text-shadow: 0 0 8px #ff007f, 0 0 20px #ff007f;
    }
    .glow-text-cyan {
      text-shadow: 0 0 8px #00f3ff, 0 0 20px #00f3ff;
    }
    .glow-text-green {
      text-shadow: 0 0 8px #a3ff00, 0 0 20px #a3ff00;
    }

    /* Scrollbar customization */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #07070c;
    }
    ::-webkit-scrollbar-thumb {
      background: #ff007f;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen bg-cyber-grid text-gray-100 relative selection:bg-y2k-pink selection:text-white flex flex-col justify-between">
  <!-- Scanline Overlay -->
  <div class="fixed inset-0 scanlines z-50 pointer-events-none opacity-40"></div>

  <!-- MAIN WRAPPER -->
  <div id="app" class="relative z-10 min-h-screen flex flex-col justify-between p-3 sm:p-6 max-w-7xl mx-auto w-full">
    
    <!-- HEADER NAVBAR -->
    <header class="border-2 border-y2k-cyan/40 bg-y
